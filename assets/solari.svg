<svg width="1600" height="600" viewBox="0 0 1600 600" fill="none" xmlns="http://www.w3.org/2000/svg">
    <style>
        :root {
            --background-color: #FFD61F;
            --background-subtle: rgba(255, 255, 255, 0.05);
            --background-light: #FFEF93;
            --background-accent: #FF5A4C;
        }

        #solari {
            animation: solari-intro 1200ms cubic-bezier(0, 0, 0.2, 1);
        }

        #subtle {
            animation: subtle-drift 14s cubic-bezier(0.4, 0.2, 0.6, 0.8) infinite;
        }

        #light {
            animation: light-drift 18s cubic-bezier(0.4, 0.2, 0.6, 0.8) infinite;
        }

        #accent {
            transform-origin: 800px 1200px;
            animation: accent-drift 18s cubic-bezier(0.4, 0.2, 0.6, 0.8) infinite;
        }

        @keyframes solari-intro {
            0%, 50% {
                opacity: 0;
                transform: translate(0, 60px);
            }
            
            100% {
                opacity: 1;
                transform: translate(0, 0);
            }
        }

        @keyframes subtle-drift {
            0%, 100% { transform: translate(0px, 0px); }
            12% { transform: translate(480px, -120px); }
            34% { transform: translate(620px, 380px); }
            45% { transform: translate(1320px, -80px); }
            63% { transform: translate(1180px, 480px); }
            78% { transform: translate(460px, 120px); }
            92% { transform: translate(180px, 360px); }
        }

        @keyframes light-drift {
            0%, 100% { transform: translate(0px, 0px); }
            19% { transform: translate(-180px, 260px); }
            28% { transform: translate(-980px, 680px); }
            49% { transform: translate(-1240px, 160px); }
            60% { transform: translate(-720px, 760px); }
            81% { transform: translate(-520px, 80px); }
            93% { transform: translate(-80px, 360px); }
        }

        @keyframes accent-drift {
            0% { transform: translate(0px, 0px) scale(1); }
            12% { transform: translate(320px, 120px) scale(1.18); }
            27% { transform: translate(-100px, 64px) scale(1.08); }
            43% { transform: translate(-420px, 156px) scale(1.24); }
            58% { transform: translate(140px, 102px) scale(1.12); }
            76% { transform: translate(380px, 200px) scale(1.3); }
            90% { transform: translate(-160px, 56px) scale(1.06); }
            100% { transform: translate(0px, 0px) scale(1); }
        }
    </style>
    <g id="image" clip-path="url(#background)">
        <rect width="1600" height="600" rx="16" fill="var(--background-color)"/>
        <circle id="subtle" cx="-200" cy="000" r="800" fill="url(#subtle-gradient)" />
        <circle id="light" cx="1600" cy="-400" r="1200" fill="url(#light-gradient)" />
        <circle id="accent" cx="800" cy="1200" r="1200" fill="url(#accent-gradient)" />
        <g id="solari">
