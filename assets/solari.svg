            <path d="M584.098 263.987C584.098 265.994 584.474 267.915 585.157 269.681L615.839 239L624.347 247.509L593.446 278.408C595.414 279.289 597.596 279.781 599.892 279.781H624.879V291.813H599.892C584.524 291.813 572.066 279.355 572.066 263.987V239H584.098V263.987Z" fill="black"/>
        </g>
    </g>
    <defs>
        <radialGradient id="subtle-gradient">
            <stop offset="50%" stop-color="var(--background-subtle)" stop-opacity="1" />
            <stop offset="100%" stop-color="var(--background-subtle)" stop-opacity="0" />
        </radialGradient>
        <radialGradient id="light-gradient">
            <stop offset="50%" stop-color="var(--background-light)" stop-opacity="1" />
            <stop offset="100%" stop-color="var(--background-light)" stop-opacity="0" />
        </radialGradient>
        <radialGradient id="accent-gradient">
            <stop offset="50%" stop-color="var(--background-accent)" stop-opacity="1" />
            <stop offset="100%" stop-color="var(--background-accent)" stop-opacity="0" />
        </radialGradient>
        <clipPath id="background">
            <rect width="1600" height="600" rx="16" fill="black"/>
        </clipPath>
    </defs>
</svg>
